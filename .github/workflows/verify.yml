name: Verify snapshots and tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate manifests, ancestors and v0.6 tests
        run: python scripts/check_repository.py
      - name: Check isolated 3bet pressure audit tests
        run: python -m unittest discover -s audits/g2a_v0_7 -p 'test_*.py' -q
      - name: Recompute tracked pressure reports
        run: python audits/g2a_v0_7/pressure_audit.py
      - name: Confirm deterministic audit CSV output
        run: git diff --exit-code -- audits/g2a_v0_7/3BET_PRESSURE_ALL_15_v0_7.csv audits/g2a_v0_7/3BET_PRESSURE_HANDS_8_v0_7.csv

      - name: Run defense composition audit tests v0.8
        run: python -m unittest discover -s audits/g2a_v0_8 -p 'test_*.py' -q
      - name: Recompute tracked v0.8 reports
        run: python audits/g2a_v0_8/defense_composition.py
      - name: Verify v0.8 report identity
        run: git diff --exit-code -- audits/g2a_v0_8/*.csv
      - name: Verify v0.8 SHA256 manifest
        run: cd audits/g2a_v0_8 && sha256sum -c AUDIT_SHA256SUMS.txt

      - name: Run HJ-CO economic frontier audit tests v0.9
        run: python -m unittest discover -s audits/g2a_v0_9 -p 'test_*.py' -q
      - name: Recompute v0.9 HJ-CO frontier reports
        run: python audits/g2a_v0_9/hj_co_frontier.py
      - name: Verify v0.9 reports are deterministic
        run: git diff --exit-code -- audits/g2a_v0_9/*.csv
      - name: Verify v0.9 SHA256 audit manifest
        run: cd audits/g2a_v0_9 && sha256sum -c AUDIT_SHA256SUMS.txt

      - name: Check HJ-CO physical equity audit v0.10
        run: python -m unittest discover -s audits/g2a_v0_10 -p 'test_*.py' -q
      - name: Recompute independent MC estimates v0.10
        run: python audits/g2a_v0_10/equity_audit.py --mc --samples 50000 --output audits/g2a_v0_10/HJ_CO_EQUITY_15_MONTE_CARLO_v0_10.csv
      - name: Verify deterministic MC report and derived CSV metadata
        run: git diff --exit-code -- audits/g2a_v0_10/HJ_CO_EQUITY_15_MONTE_CARLO_v0_10.csv
      - name: Verify v0.10 SHA-256 manifest
        run: cd audits/g2a_v0_10 && sha256sum -c AUDIT_SHA256SUMS.txt

      - name: Run source admissibility tests v0.11
        run: python -m unittest discover -s audits/g2a_v0_11 -p 'test_*.py' -q
      - name: Recompute v0.11 source applicability report
        run: python audits/g2a_v0_11/source_gate.py
      - name: Verify v0.11 report determinism
        run: git diff --exit-code -- audits/g2a_v0_11/SOURCE_APPLICABILITY_v0_11.csv
      - name: Verify v0.11 SHA256 manifest
        run: cd audits/g2a_v0_11 && sha256sum -c AUDIT_SHA256SUMS.txt

      - name: PORT-0 strict OpenPPL-first source proof (7 tests)
        run: python -m unittest discover -s portability -p 'test_*.py' -q
      - name: PORT-0 parser smoke check
        run: python portability/oppl_probe.py

      - name: PORT-1 LJ RFI OPPL source-parity tests
        run: python -m unittest discover -s portability/port1 -p 'test_*.py' -q
      - name: Rebuild PORT-1 mapping from frozen reference
        run: python portability/port1/generate_port1.py
      - name: Ensure deterministic PORT-1 OPPL and hand mapping
        run: git diff --exit-code -- portability/port1/lj_rfi_pure_port1.oppl portability/port1/PORT1_LJ_169_MAPPING.csv
      - name: Verify PORT-1 SHA256 snapshot
        run: cd portability/port1 && sha256sum -c PORT1_SHA256SUMS.txt

      - name: Run PORT-2 hand-stable OpenPPL mixture tests
        run: python -m unittest discover -s portability/port2 -p 'test_*.py' -q
      - name: Regenerate PORT-2 mixed LJ RFI source and 169-class mapping
        run: python portability/port2/generate_port2.py
      - name: Verify PORT-2 generated rules have no drift
        run: git diff --exit-code -- portability/port2/lj_rfi_mixed_port2.oppl portability/port2/PORT2_LJ_169_MAPPING.csv
      - name: Verify PORT-2 SHA256 manifest
        run: cd portability/port2 && sha256sum -c PORT2_SHA256SUMS.txt
