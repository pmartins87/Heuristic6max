name: Verify snapshots and tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate manifests, ancestors and v0.6 tests
        run: python scripts/check_repository.py
      - name: Check isolated 3bet pressure audit tests
        run: python -m unittest discover -s audits/g2a_v0_7 -p 'test_*.py' -q
      - name: Recompute tracked pressure reports
        run: python audits/g2a_v0_7/pressure_audit.py
      - name: Confirm deterministic audit CSV output
        run: git diff --exit-code -- audits/g2a_v0_7/3BET_PRESSURE_ALL_15_v0_7.csv audits/g2a_v0_7/3BET_PRESSURE_HANDS_8_v0_7.csv

      - name: Run defense composition audit tests v0.8
        run: python -m unittest discover -s audits/g2a_v0_8 -p 'test_*.py' -q
      - name: Recompute tracked v0.8 reports
        run: python audits/g2a_v0_8/defense_composition.py
      - name: Verify v0.8 report identity
        run: git diff --exit-code -- audits/g2a_v0_8/*.csv
      - name: Verify v0.8 SHA256 manifest
        run: cd audits/g2a_v0_8 && sha256sum -c AUDIT_SHA256SUMS.txt

      - name: Run HJ-CO economic frontier audit tests v0.9
        run: python -m unittest discover -s audits/g2a_v0_9 -p 'test_*.py' -q
      - name: Recompute v0.9 HJ-CO frontier reports
        run: python audits/g2a_v0_9/hj_co_frontier.py
      - name: Verify v0.9 reports are deterministic
        run: git diff --exit-code -- audits/g2a_v0_9/*.csv
      - name: Verify v0.9 SHA256 audit manifest
        run: cd audits/g2a_v0_9 && sha256sum -c AUDIT_SHA256SUMS.txt

      - name: Check HJ-CO physical equity audit v0.10
        run: python -m unittest discover -s audits/g2a_v0_10 -p 'test_*.py' -q
      - name: Recompute independent MC estimates v0.10
        run: python audits/g2a_v0_10/equity_audit.py --mc --samples 50000 --output audits/g2a_v0_10/HJ_CO_EQUITY_15_MONTE_CARLO_v0_10.csv
      - name: Verify deterministic MC report and derived CSV metadata
        run: git diff --exit-code -- audits/g2a_v0_10/HJ_CO_EQUITY_15_MONTE_CARLO_v0_10.csv
      - name: Verify v0.10 SHA-256 manifest
        run: cd audits/g2a_v0_10 && sha256sum -c AUDIT_SHA256SUMS.txt

      - name: Run source admissibility tests v0.11
        run: python -m unittest discover -s audits/g2a_v0_11 -p 'test_*.py' -q
      - name: Recompute v0.11 source applicability report
        run: python audits/g2a_v0_11/source_gate.py
      - name: Verify v0.11 report determinism
        run: git diff --exit-code -- audits/g2a_v0_11/SOURCE_APPLICABILITY_v0_11.csv
      - name: Verify v0.11 SHA256 manifest
        run: cd audits/g2a_v0_11 && sha256sum -c AUDIT_SHA256SUMS.txt

      - name: PORT-0 strict OpenPPL-first source proof (7 tests)
        run: python -m unittest discover -s portability -p 'test_*.py' -q
      - name: PORT-0 parser smoke check
        run: python portability/oppl_probe.py

      - name: PORT-1 LJ RFI OPPL source-parity tests
        run: python -m unittest discover -s portability/port1 -p 'test_*.py' -q
      - name: Rebuild PORT-1 mapping from frozen reference
        run: python portability/port1/generate_port1.py
      - name: Ensure deterministic PORT-1 OPPL and hand mapping
        run: git diff --exit-code -- portability/port1/lj_rfi_pure_port1.oppl portability/port1/PORT1_LJ_169_MAPPING.csv
      - name: Verify PORT-1 SHA256 snapshot
        run: cd portability/port1 && sha256sum -c PORT1_SHA256SUMS.txt

      - name: Run PORT-2 hand-stable OpenPPL mixture tests
        run: python -m unittest discover -s portability/port2 -p 'test_*.py' -q
      - name: Regenerate PORT-2 mixed LJ RFI source and 169-class mapping
        run: python portability/port2/generate_port2.py
      - name: Verify PORT-2 generated rules have no drift
        run: git diff --exit-code -- portability/port2/lj_rfi_mixed_port2.oppl portability/port2/PORT2_LJ_169_MAPPING.csv
      - name: Verify PORT-2 SHA256 manifest
        run: cd portability/port2 && sha256sum -c PORT2_SHA256SUMS.txt

      - name: Run PORT-3 offline replay-evidence tests (never OH runtime)
        run: python -m unittest discover -s portability/port3 -p 'test_*.py' -q
      - name: Recompute synthetic-only replay assessment
        run: python portability/port3/replay_audit.py
      - name: Verify static evidence CSV determinism
        run: git diff --exit-code -- portability/port3/SYNTHETIC_REPLAY_REPORT.csv
      - name: Verify PORT-3 SHA256 manifest
        run: cd portability/port3 && sha256sum -c PORT3_SHA256SUMS.txt

      - name: Verify five-position first-in OpenPPL module (12 tests)
        run: python -m unittest discover -s portability/rfi_mvp -p 'test_*.py' -q
      - name: Rebuild first-in OpenPPL and 845-class RFI map
        run: python portability/rfi_mvp/generate_rfi_mvp.py
      - name: Confirm first-in OpenPPL and mapped ranges do not drift
        run: git diff --exit-code -- portability/rfi_mvp/rfi_6max_mvp.oppl portability/rfi_mvp/RFI_6MAX_845_MAPPING.csv
      - name: Check RFI-MVP SHA256 manifest
        run: cd portability/rfi_mvp && sha256sum -c RFI_MVP_SHA256SUMS.txt

      - name: Test VS_OPEN 15-node native OpenPPL module
        run: python -m unittest discover -s portability/vs_open_mvp -p 'test_*.py' -q
      - name: Regenerate 15-node VS_OPEN OpenPPL and combined RFI source
        run: python portability/vs_open_mvp/generate_vs_open_mvp.py
      - name: Verify 2535 mapped classes and OpenPPL source identity
        run: git diff --exit-code -- portability/vs_open_mvp/vs_open_6max_mvp.oppl portability/vs_open_mvp/preflop_rfi_vsopen_draft.oppl portability/vs_open_mvp/VS_OPEN_2535_MAPPING.csv
      - name: Verify VS_OPEN-MVP SHA256 manifest
        run: cd portability/vs_open_mvp && sha256sum -c VS_OPEN_MVP_SHA256SUMS.txt

      - name: Test 15 VS_3BET OpenPPL trees (23 tests)
        run: python -m unittest discover -s portability/vs_3bet_mvp -p 'test_*.py' -q
      - name: Rebuild VS_3BET and combined RFI VS_OPEN VS3 from frozen baseline
        run: python portability/vs_3bet_mvp/generate_vs3_mvp.py
      - name: Check deterministic VS_3BET OpenPPL and 2535-case map
        run: git diff --exit-code -- portability/vs_3bet_mvp/vs_3bet_6max_mvp.oppl portability/vs_3bet_mvp/preflop_rfi_vsopen_vs3_draft.oppl portability/vs_3bet_mvp/VS3_2535_MAPPING.csv
      - name: Verify VS_3BET SHA256 snapshot
        run: cd portability/vs_3bet_mvp && sha256sum -c VS3_MVP_SHA256SUMS.txt

      - name: Test SRP-HU postflop source rules (18 tests)
        run: python -m unittest discover -s portability/srp_hu_mvp -p 'test_*.py' -q
      - name: Rebuild combined preflop plus SRP-HU OpenPPL source
        run: python portability/srp_hu_mvp/rebuild_combined.py
      - name: Verify integrated OpenPPL is deterministic
        run: git diff --exit-code -- portability/srp_hu_mvp/preflop_and_srp_hu_draft.oppl
      - name: Verify SRP-HU SHA256 manifest
        run: cd portability/srp_hu_mvp && sha256sum -c SRP_HU_SHA256SUMS.txt

      - name: Test G3 SRP heads-up historical paths (18 tests)
        run: python -m unittest discover -s portability/srp_history_v1 -p 'test_*.py' -q
      - name: Rebuild historical SRP and integrated OpenPPL from frozen sources
        run: python portability/srp_history_v1/build_history.py
      - name: Check 9-path matrix and OpenPPL deterministic source
        run: git diff --exit-code -- portability/srp_history_v1/srp_hu_history_v1.oppl portability/srp_history_v1/preflop_srp_history_v1.oppl portability/srp_history_v1/HISTORY_FLOP_TURN_9_PATHS.csv
      - name: Verify G3-HIST SHA256 manifest
        run: cd portability/srp_history_v1 && sha256sum -c HISTORY_SHA256SUMS.txt

      - name: Test G3-HIST-v2 six families and 36 river paths (18 tests)
        run: python -m unittest discover -s portability/srp_history_v2 -p 'test_*.py' -q
      - name: Rebuild 36-path historical tree and integrated OpenPPL
        run: python portability/srp_history_v2/build_history_v2.py
      - name: Verify deterministic G3-HIST-v2 OpenPPL and lineage matrix
        run: git diff --exit-code -- portability/srp_history_v2/srp_hu_history_v2.oppl portability/srp_history_v2/preflop_srp_history_v2.oppl portability/srp_history_v2/HISTORY_FLOP_TURN_36_PATHS.csv
      - name: Verify G3-HIST-v2 SHA256 manifest
        run: cd portability/srp_history_v2 && sha256sum -c HISTORY_V2_SHA256SUMS.txt

      - name: Test chronological SRP-HU HIST-v3, native flags and alias quarantine (36 tests)
        run: python -m unittest discover -s portability/srp_history_v3 -p 'test_*.py' -q
      - name: Rebuild HIST-v3 and enumerate 484 legal two-street words
        run: python portability/srp_history_v3/build_history_v3.py
      - name: Verify HIST-v3 sources and coverage reports deterministic
        run: git diff --exit-code -- portability/srp_history_v3/HIST3_484_CHRONOLOGICAL_PATHS.csv portability/srp_history_v3/HIST3_OBSERVABILITY.csv portability/srp_history_v3/HIST3_ROUTING_COVERAGE.csv portability/srp_history_v3/srp_hu_history_v3.oppl portability/srp_history_v3/preflop_srp_history_v3.oppl
      - name: Verify HIST-v3 SHA256 manifest
        run: cd portability/srp_history_v3 && sha256sum -c HIST3_SHA256SUMS.txt

      - name: Test 3bet-pot HU action model and origin tracing (15 tests)
        run: python -m unittest discover -s portability/p3bet_hu_v1 -p 'test_*.py' -q
      - name: Regenerate native OpenPPL 3bet-pot HU merged strategy
        run: python portability/p3bet_hu_v1/build_p3bet_hu.py
      - name: Check 3bet HU origination and integrated formula against committed version
        run: git diff --exit-code -- portability/p3bet_hu_v1/preflop_intent_capture.oppl portability/p3bet_hu_v1/preflop_srp_and_3bet_hu_draft.oppl
      - name: Verify P3BET HU SHA256 manifest
        run: cd portability/p3bet_hu_v1 && sha256sum -c P3BET_HU_SHA256SUMS.txt

      - name: Test immutable R10d minimum-capability comparison (12 tests)
        run: python -m unittest discover -s benchmarks/r10d_floor -p 'test_*.py' -q
      - name: Regenerate honest R10d gap report (release must remain BLOCKED)
        run: python benchmarks/r10d_floor/comparison.py
      - name: Verify R10d gap report identity
        run: git diff --exit-code -- benchmarks/r10d_floor/CURRENT_GAP_REPORT.json
      - name: Verify R10d benchmark SHA256 manifest
        run: cd benchmarks/r10d_floor && sha256sum -c BENCHMARK_SHA256SUMS.txt

      - name: Test native SRP 3way postflop branch (16 tests)
        run: python -m unittest discover -s portability/p3way_srp_v1 -p 'test_*.py' -q
      - name: Generate integrated native OpenPPL threeway SRP branch
        run: python portability/p3way_srp_v1/build_threeway.py
      - name: Confirm 3way SRP provenance and full OpenPPL strategy determinism
        run: git diff --exit-code -- portability/p3way_srp_v1/preflop_coldcall_intent.oppl portability/p3way_srp_v1/preflop_srp_3bet_3way_draft.oppl
      - name: Verify threeway SRP SHA256 manifest
        run: cd portability/p3way_srp_v1 && sha256sum -c P3WAY_SRP_SHA256SUMS.txt
      - name: Recheck updated R10d gap on latest 3way integrated code
        run: python benchmarks/r10d_floor/comparison.py
      - name: Confirm R10d comparison report updated with threeway
        run: git diff --exit-code -- benchmarks/r10d_floor/CURRENT_GAP_REPORT.json
      - name: Verify updated R10d SHA256 manifest
        run: cd benchmarks/r10d_floor && sha256sum -c BENCHMARK_SHA256SUMS.txt
      - name: Run 4-6way SRP and multiway to HU regressions
        run: python -m unittest discover -s portability/multiway_v2 -p 'test_*.py' -q
      - name: Regenerate 4-6way and transition source plus topology report
        run: python portability/multiway_v2/build_multiway_v2.py
      - name: Check deterministic integrated multiway v2 code and topology
        run: git diff --exit-code -- portability/multiway_v2/preflop_multiway_v2_draft.oppl portability/multiway_v2/MULTIWAY_V2_TOPOLOGY.csv
      - name: Verify SHA256 for multiway v2
        run: cd portability/multiway_v2 && sha256sum -c MULTIWAY_V2_SHA256SUMS.txt
      - name: Run BB single-limp OpenPPL regressions
        run: python -m unittest discover -s portability/limped_bb_v1 -p 'test_*.py' -q
      - name: Regenerate BB limp preflop markers and combined formula
        run: python portability/limped_bb_v1/build_limp_bb.py
      - name: Check deterministic BB limp formula and intent markers
        run: git diff --exit-code -- portability/limped_bb_v1/preflop_multiway_limp_bb_draft.oppl portability/limped_bb_v1/limp_bb_preflop_capture.oppl
      - name: Verify SHA256 for BB limp
        run: cd portability/limped_bb_v1 && sha256sum -c LIMP_BB_SHA256SUMS.txt
      - name: Re-evaluate latest integrated R10d floor and unit tests
        run: python -m unittest discover -s benchmarks/r10d_floor -p 'test_*.py' -q && python benchmarks/r10d_floor/comparison.py
      - name: Verify benchmark unchanged and SHA256
        run: git diff --exit-code -- benchmarks/r10d_floor/CURRENT_GAP_REPORT.json && cd benchmarks/r10d_floor && sha256sum -c BENCHMARK_SHA256SUMS.txt

      - name: Test SRP partial-opponent history (14)
        run: python -m unittest discover -s portability/multiway_transitions_v3 -p 'test_*.py' -q
      - name: Regenerate SRP partial multiway topology
        run: python portability/multiway_transitions_v3/build_transitions_v3.py
      - name: Check deterministic SRP partial artifacts
        run: git diff --exit-code -- portability/multiway_transitions_v3/topology_helpers.oppl portability/multiway_transitions_v3/preflop_multiway_partial_v3_draft.oppl portability/multiway_transitions_v3/PARTIAL_TRANSITION_TOPOLOGY.csv
      - name: Verify MWT3 SHA
        run: cd portability/multiway_transitions_v3 && sha256sum -c MWT3_SHA256SUMS.txt

      - name: Test BB after 2-5 limpers (12)
        run: python -m unittest discover -s portability/multilimp_bb_v2 -p 'test_*.py' -q
      - name: Regenerate BB multi-limper source
        run: python portability/multilimp_bb_v2/build_multilimp.py
      - name: Check deterministic BB multi-limper artifacts
        run: git diff --exit-code -- portability/multilimp_bb_v2/multilimp_topology.oppl portability/multilimp_bb_v2/multilimp_preflop_capture.oppl portability/multilimp_bb_v2/preflop_multiway_partial_multilimp_v2_draft.oppl portability/multilimp_bb_v2/MULTILIMP_TOPOLOGY.csv
      - name: Verify MLIMP2 SHA
        run: cd portability/multilimp_bb_v2 && sha256sum -c MLIMP2_SHA256SUMS.txt

      - name: Test 3bet multiway sources (12)
        run: python -m unittest discover -s portability/p3bet_multiway_v1 -p 'test_*.py' -q
      - name: Regenerate 3bet multiway and current combined source
        run: python portability/p3bet_multiway_v1/build_3bet_multiway.py
      - name: Check deterministic 3bet multiway source
        run: git diff --exit-code -- portability/p3bet_multiway_v1/threebet_multiway_topology.oppl portability/p3bet_multiway_v1/preflop_srp_limp_3bet_multiway_draft.oppl portability/p3bet_multiway_v1/THREEBET_MW_TOPOLOGY.csv
      - name: Verify P3BMW1 SHA
        run: cd portability/p3bet_multiway_v1 && sha256sum -c P3BM1_SHA256SUMS.txt
      - name: Verify R10d report against newest integrated source
        run: python benchmarks/r10d_floor/comparison.py
      - name: Verify newest R10d report and SHA
        run: git diff --exit-code -- benchmarks/r10d_floor/CURRENT_GAP_REPORT.json
      - name: Check R10d SHA after new modules
        run: cd benchmarks/r10d_floor && sha256sum -c BENCHMARK_SHA256SUMS.txt

      - name: Test ISO-1 isolated-limper OpenPPL source (13 tests)
        run: python -m unittest discover -s portability/iso_raise_v1 -p 'test_*.py' -q
      - name: Rebuild ISO-1 draft integrated OpenPPL from frozen ancestors
        run: python portability/iso_raise_v1/build_iso.py
      - name: Assert ISO-1 source-merger determinism
        run: git diff --exit-code -- portability/iso_raise_v1/iso_integrated_draft.oppl
      - name: Verify ISO-1 SHA256 source snapshot
        run: cd portability/iso_raise_v1 && sha256sum -c ISO1_SHA256SUMS.txt

      - name: Test BLISO-2 SB/BB isolation paths (18 tests)
        run: python -m unittest discover -s portability/blind_iso_v2 -p 'test_*.py' -q
      - name: Rebuild BLISO-2 OpenPPL from ISO-1 exact source
        run: python portability/blind_iso_v2/build_blind_iso.py
      - name: Verify deterministic BLISO-2 combined source
        run: git diff --exit-code -- portability/blind_iso_v2/blind_iso_integrated_draft.oppl
      - name: Verify BLISO-2 SHA256 snapshot
        run: cd portability/blind_iso_v2 && sha256sum -c BLISO2_SHA256SUMS.txt
      - name: Update factual R10d benchmark against BLISO-2 latest draft
        run: python benchmarks/r10d_floor/comparison.py
      - name: Verify BLISO-2 R10d metrics and benchmark SHA256
        run: git diff --exit-code -- benchmarks/r10d_floor/CURRENT_GAP_REPORT.json && cd benchmarks/r10d_floor && sha256sum -c BENCHMARK_SHA256SUMS.txt
